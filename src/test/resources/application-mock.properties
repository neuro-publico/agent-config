# Mock environment configuration - no database required
micronaut.application.name=agent-config-ms-test

# Disable datasource for mock tests
datasources.default.enabled=false

# Disable flyway for mock tests
flyway.datasources.default.enabled=false

# Disable JPA for mock tests  
jpa.default.enabled=false

# Vector DB mock URL
micronaut.http.services.vectordb.url=http://localhost:9999
